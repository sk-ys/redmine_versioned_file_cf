en:
  label_versioned_file: File (revision-managed)
  versioned_file_cf:
    error_versioned_file_not_text: Only text files can be uploaded to this custom field.
    error_versioned_file_unchanged: The file content is unchanged.
    ui:
      conversion_title: Convert field format
      convert_to_versioned_file: Convert to Versioned file format
      convert_to_file: Convert to File format
      confirm_convert_to_file: Convert this Versioned file format to File format? All revision history will be deleted.
      revert_warning: Converting from Versioned file format to File format deletes all revision history.
      remaining_invalid_values: "  ...and %{count} more"
    tasks:
      common:
        label_start: "Checking custom field id=%{id} (%{name})... total values=%{total}, values with attachments=%{filled}"
        label_invalid_header: "Operation aborted. %{count} values cannot be migrated:"
        label_invalid_value: "  CustomValue id=%{custom_value_id} (%{customized_type}#%{customized_id}, attachment=%{attachment_id}): %{reason}"
        error_missing_custom_field_id: Please specify ID.
        error_custom_field_not_found: "Custom field id=%{id} was not found."
        error_aborted: Operation has been aborted.
      cleanup_orphan_attachments:
        label_none: No orphan attachments found.
        label_start: Deleting %{count} orphan attachments...
        label_deleted: "  Deleted: Attachment id=%{id}, disk_filename=%{disk_filename}"
        label_done: "Done: deleted %{count} attachments."
      migrate_file_custom_field:
        label_dry_run: "Dry run completed. %{count} values can be migrated."
        label_done_no_values: Field format changed to Versioned file. No populated values were found.
        label_done: "Done. Migrated %{count} values and changed the field format to Versioned file."
        error_already_versioned_file: "Custom field id=%{id} is already Versioned file."
        error_invalid_field_format: "Custom field id=%{id} is not a file custom field (current format: %{field_format})."
        reason_attachment_id_invalid: The value does not contain a valid attachment id.
        reason_attachment_missing: The attachment could not be found.
        reason_attachment_not_owned: The attachment is not associated with this custom value.
        reason_attachment_not_text: Only text attachments can be migrated.
        reason_already_migrated: A revision already exists for this custom value.
      revert_file_custom_field:
        label_dry_run: "Dry run completed. %{count} revision records would be deleted."
        label_done_no_values: Field format changed to File. No revision history was found.
        label_done: "Done. Reverted %{count} values to File and deleted %{revisions} revision records."
        error_already_file: "Custom field id=%{id} is already File."
        error_invalid_field_format: "Custom field id=%{id} is not a Versioned file custom field (current format: %{field_format})."
        reason_attachment_id_invalid: The value does not match the current revision attachment id.
        reason_attachment_missing: The attachment for the current revision could not be found.
        reason_attachment_not_owned: The current revision attachment is not associated with the current revision.
        reason_active_revision_missing: No active revision could be found.
        reason_multiple_active_revisions: Multiple active revisions were found.